# Full run over all items.
run_name: full
seed: 13
dataset:
  path: data/items.jsonl
  sample_n: null
generators:
  - {name: qwen38, provider: bharatcode, model: qwen-3.8-27b, max_tokens: 2000}  # thinking model: budget covers reasoning + answer
  - {name: qwen25_local, provider: ollama, model: "qwen2.5:7b", max_tokens: 300, optional: true}
  # - {name: claude, provider: anthropic, model: claude-opus-5-5, max_tokens: 300, optional: true}
judge:
  provider: bharatcode
  model: qwen-3.8-27b
  prompt_file: prompts/judge_v1.md
  max_tokens: 3000          # thinking model: reasoning tokens count toward this
  temperature: 0.0
  shuffle_seed: 13        # randomizes which answer is judged first (position-bias check)
labels:
  human_a: labels/human_a.jsonl
  human_b: labels/human_b.jsonl
analysis:
  bootstrap_iters: 1000
  ci: 0.95
pricing_usd_per_mtok:     # edit to current list prices; used only for the cost table
  claude-opus-5-5: {input: 5.0, output: 25.0}
max_budget_usd: 3.0       # run aborts before calling the API if estimate exceeds this
